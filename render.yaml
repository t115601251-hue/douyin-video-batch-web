services:
  - type: web
    name: video-batch-workspace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: HOSTED_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.11
